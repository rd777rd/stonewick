{% extends "base.html" %}
{% block title %}Create an account — Stonewick{% endblock %}
{% block content %}
<section class="container section auth-form">
  <h1>Create an account</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Sign up</button>
  </form>
  <p>Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
</section>
{% endblock %}
