{% extends "base.html" %}
{% block title %}Log in — Stonewick{% endblock %}
{% block content %}
<section class="container section auth-form">
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
  <p>New here? <a href="{% url 'accounts:signup' %}">Create an account</a></p>
</section>
{% endblock %}
