{% extends "base.html" %}
{% block title %}Journal — Stonewick{% endblock %}
{% block content %}
<section class="container section">
  <h1>Journal</h1>
  <div class="post-grid">
    {% for post in page_obj %}
      <article class="post-card">
        <a href="{{ post.get_absolute_url }}">
          <h2>{{ post.title }}</h2>
          <p>{{ post.excerpt }}</p>
        </a>
      </article>
    {% empty %}
      <p>No posts yet.</p>
    {% endfor %}
  </div>
  {% include "partials/_pagination.html" with page_obj=page_obj %}
</section>
{% endblock %}
